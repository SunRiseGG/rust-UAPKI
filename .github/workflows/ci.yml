name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: build & test (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ libcurl4-openssl-dev

      # rust-toolchain.toml pins the channel; rustup honors it automatically
      - name: Show toolchain
        run: rustc --version && cargo --version && cmake --version

      # Statically links libuapki.a + libuapkic.a + libuapkif.a via
      # --start-group — this job is what validates the Linux link path.
      - name: cargo test
        run: cargo test --release --workspace
